# Weekly version updates, with breaking upgrades isolated from minor/patch.
# Two open PRs per ecosystem allow routine updates while a major is pending.
# Security updates use separate GitHub settings and are not capped here.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      gomod-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      gomod-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: docker
    directory: /templates/builder
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      docker-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
