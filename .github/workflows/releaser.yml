name: GoReleaser

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -v ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # ARCHITECTURE: this maintained cross toolchain supplies the Linux and
      # macOS compilers required by Core's tree-sitter-backed project
      # inspection while preserving the GoReleaser artifact contract.
      - name: Install Syft for archive SBOMs
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.44.0
      - name: Run CGO-capable GoReleaser
        run: >-
          docker run --rm
          -e GITHUB_TOKEN
          -v "$GITHUB_WORKSPACE:/workspace"
          -v "$SYFT_PATH:/usr/local/bin/syft:ro"
          -w /workspace
          ghcr.io/goreleaser/goreleaser-cross:v1.27.1-1
          release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          SYFT_PATH: ${{ steps.syft.outputs.cmd }}
